[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-pipe"
version = "0.1.0"
description = "Evidence-first contract clause extraction pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.122",
    "huggingface-hub>=0.34.0",
    "langchain-aws>=0.2.0",
    "langgraph>=1.2.18",
    "langsmith>=0.14.16",
    "pydantic>=2.14.2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
doc-pipe = "src.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["specs", "data", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
